<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A84FF"/><stop offset=".55" stop-color="#5E5CE6"/><stop offset="1" stop-color="#BF5AF2"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="28"/></filter>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="r"><rect width="1000" height="260" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="1000" height="260" fill="url(#bg)"/>
    <g filter="url(#blur)" opacity=".75">
      <circle cx="180" cy="80" r="90" fill="#64D2FF"><animate attributeName="cx" values="180;320;180" dur="9s" repeatCount="indefinite"/></circle>
      <circle cx="800" cy="200" r="100" fill="#FF375F"><animate attributeName="cx" values="800;650;800" dur="11s" repeatCount="indefinite"/></circle>
      <circle cx="560" cy="40" r="70" fill="#fff" opacity=".6"><animate attributeName="cy" values="40;150;40" dur="8s" repeatCount="indefinite"/></circle>
    </g>
    <rect width="1000" height="130" fill="url(#shine)"/>
    <text x="500" y="125" text-anchor="middle" font-family="-apple-system,'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif" font-size="68" font-weight="700" fill="#fff" letter-spacing="-1">Tejas Patil</text>
    <text x="500" y="172" text-anchor="middle" font-family="-apple-system,'SF Pro Text','Segoe UI',Helvetica,Arial,sans-serif" font-size="24" fill="#fff" fill-opacity=".92">AI &amp; Cloud Data Engineer</text>
    <path d="M420 200 C 450 188, 470 212, 500 200 S 550 190, 580 202" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-dasharray="260" stroke-dashoffset="260">
      <animate attributeName="stroke-dashoffset" values="260;0" dur="2s" fill="freeze"/></path>
  </g>
  <rect x=".5" y=".5" width="999" height="259" rx="28" fill="none" stroke="#fff" stroke-opacity=".5"/>
</svg>
